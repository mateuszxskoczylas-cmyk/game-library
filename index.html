<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shinhati · Game Library</title>
<meta name="description" content="Prywatna biblioteka gier Steam — statusy ukończenia, 100%, do skończenia i preorder.">
<meta name="theme-color" content="#1677ff">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --blue:#1677ff;
  --blue-2:#0b5ed7;
  --blue-soft:#eaf3ff;
  --bg:#f4f8ff;
  --bg-2:#ffffff;
  --panel:rgba(255,255,255,.88);
  --panel-solid:#ffffff;
  --text:#111827;
  --muted:#66758f;
  --line:#dbe7f7;
  --line-strong:#bfd4f2;
  --shadow:0 12px 36px rgba(31,80,145,.10);
  --tile-shadow:0 7px 20px rgba(42,88,150,.08);
  --completed:#0fba6f;
  --completed-bg:#e2f8ed;
  --perfect:#16a86e;
  --perfect-bg:linear-gradient(135deg,#def8ea 0%,#e8f8f0 62%,#e8f1ff 100%);
  --finish:#d68118;
  --finish-bg:#fff5e8;
  --preorder:#7a50db;
  --preorder-bg:#f4efff;

  --tile-completed:linear-gradient(145deg,#effff7 0%,#dff7ea 100%);
  --tile-perfect:linear-gradient(145deg,#e5fbef 0%,#dcf7e9 68%,#e8f1ff 100%);
  --tile-finish:linear-gradient(145deg,#fffaf2 0%,#fff0dd 100%);
  --tile-preorder:linear-gradient(145deg,#f7f2ff 0%,#edf2ff 100%);
}
html[data-theme="dark"]{
  --bg:#07101d;
  --bg-2:#0a1425;
  --panel:rgba(12,24,44,.88);
  --panel-solid:#0d192d;
  --text:#f4f8ff;
  --muted:#91a3bf;
  --line:#203653;
  --line-strong:#2e4e78;
  --shadow:0 18px 50px rgba(0,0,0,.34);
  --tile-shadow:0 8px 24px rgba(0,0,0,.22);
  --blue-soft:#10284a;
  --completed:#4be09a;
  --completed-bg:#0c3225;
  --perfect:#58dfa5;
  --perfect-bg:linear-gradient(135deg,#0c3427 0%,#10342d 65%,#122844 100%);
  --finish:#ffb761;
  --finish-bg:#2c2114;
  --preorder:#c4a0ff;
  --preorder-bg:#261d3a;

  --tile-completed:linear-gradient(145deg,#0b2d20 0%,#0f3828 100%);
  --tile-perfect:linear-gradient(145deg,#0b3224 0%,#0f3a2d 68%,#112943 100%);
  --tile-finish:linear-gradient(145deg,#2a1d10 0%,#312315 100%);
  --tile-preorder:linear-gradient(145deg,#251b35 0%,#18243d 100%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 8% -6%,rgba(22,119,255,.18),transparent 28%),
    radial-gradient(circle at 100% 0%,rgba(72,149,255,.10),transparent 24%),
    var(--bg);
  transition:background .22s,color .22s;
}
button,input{font:inherit}
button{color:inherit}
.shell{max-width:1460px;margin:0 auto;padding:24px 24px 68px}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px
}
.profile{
  display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
  min-width:0
}
.avatar{
  width:45px;height:45px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#1684ff,#0856c9);color:#fff;font-weight:800;
  box-shadow:0 8px 24px rgba(22,119,255,.24);overflow:hidden;flex:0 0 45px
}
.avatar img{width:100%;height:100%;object-fit:cover;display:none}
.profile-name{font-weight:800;font-size:17px}
.profile-sub{font-size:11px;color:var(--muted);margin-top:3px}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  padding:9px 12px;border-radius:12px;cursor:pointer;transition:.16s;
  box-shadow:0 2px 8px rgba(0,0,0,.02)
}
.btn:hover{transform:translateY(-1px);border-color:var(--line-strong)}
.btn.primary{background:linear-gradient(145deg,var(--blue),var(--blue-2));color:#fff;border-color:transparent}
.theme-btn{display:inline-flex;align-items:center;gap:8px}
.theme-icon{font-size:15px}
.hero{
  border:1px solid var(--line);border-radius:22px;background:var(--panel);
  backdrop-filter:blur(16px);box-shadow:var(--shadow);padding:20px
}
.hero-top{display:flex;justify-content:space-between;gap:20px;align-items:center}
.eyebrow{
  color:var(--blue);font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:850
}
.hero h1{font-size:26px;margin:5px 0 4px;letter-spacing:-.025em}
.hero-note{font-size:12px;color:var(--muted)}
.total{text-align:right}
.total strong{display:block;font-size:38px;line-height:1;font-weight:850;letter-spacing:-.045em}
.total span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:16px}
.stat{
  padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2)
}
.stat-n{font-size:21px;font-weight:820}
.stat-l{font-size:10px;color:var(--muted);margin-top:2px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 10px}
.toolnote{font-size:11px;color:var(--muted)}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:9px
}
.card{
  min-width:0;position:relative;aspect-ratio:1 / 1;border:1px solid var(--line);border-radius:17px;
  background:
    radial-gradient(circle at 100% 0%,rgba(22,119,255,.06),transparent 38%),
    var(--panel-solid);
  box-shadow:var(--tile-shadow);cursor:pointer;overflow:hidden;
  transition:transform .16s,border-color .16s,box-shadow .16s
}
.card:hover{
  transform:translateY(-3px);filter:brightness(1.015);
  box-shadow:0 14px 30px rgba(28,78,145,.14)
}
.card[data-status="completed"]{
  background:var(--tile-completed);border-color:rgba(15,186,111,.48);
  box-shadow:0 8px 22px rgba(24,165,102,.08)
}
.card[data-status="perfect"]{
  background:var(--tile-perfect);border-color:rgba(22,168,110,.46);
  box-shadow:0 8px 24px rgba(22,119,255,.10)
}
.card[data-status="finish"]{
  background:var(--tile-finish);border-color:rgba(214,129,24,.36);
  box-shadow:0 8px 22px rgba(214,129,24,.08)
}
.card[data-status="preorder"]{
  background:var(--tile-preorder);border-color:rgba(122,80,219,.34);
  box-shadow:0 8px 22px rgba(122,80,219,.08)
}
.card-body{
  height:100%;
  padding:15px 14px 13px;
  display:flex;
  flex-direction:column
}
.game-title{
  color:var(--text);
  font-size:15px;
  font-weight:880;
  line-height:1.20;
  letter-spacing:-.012em;
  min-height:58px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  text-wrap:balance;
}
.meta{
  display:flex;gap:5px;align-items:center;flex-wrap:wrap;
  color:var(--muted);font-size:9px;font-weight:650;
  margin-top:8px;line-height:1.25
}
.countdown{color:var(--blue);font-weight:800}
.status-wrap{margin-top:auto;padding-top:9px;min-height:31px}
.status{
  display:inline-flex;align-items:center;gap:4px;
  padding:6px 8px;border-radius:9px;border:1.5px solid;
  font-size:8.5px;font-weight:900;letter-spacing:.045em;
  text-transform:uppercase;max-width:100%
}
.status.completed{color:var(--completed);border-color:var(--completed);background:var(--completed-bg)}
.status.perfect{color:var(--perfect);border-color:var(--perfect);background:var(--perfect-bg);box-shadow:inset 0 0 0 1px rgba(22,119,255,.08)}
.status.finish{color:var(--finish);border-color:var(--finish);background:var(--finish-bg)}
.status.preorder{color:var(--preorder);border-color:var(--preorder);background:var(--preorder-bg)}
.badge100{width:14px;height:14px;object-fit:contain}
.modal-backdrop{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(4,12,25,.52);backdrop-filter:blur(8px);z-index:50
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(590px,100%);border:1px solid var(--line-strong);border-radius:22px;
  background:var(--panel-solid);box-shadow:0 36px 100px rgba(0,0,0,.30);padding:22px
}
.modal-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}
.modal h2{font-size:22px;margin:5px 0 0;line-height:1.18}
.close{
  width:35px;height:35px;flex:0 0 35px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg);cursor:pointer
}
.field{margin:13px 0}
.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:6px}
.field input{
  width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);
  border-radius:11px;padding:10px 11px;outline:none
}
.field input:focus{border-color:#69a3ed;box-shadow:0 0 0 3px rgba(22,119,255,.10)}
.status-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.status-option{
  border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;
  cursor:pointer;text-align:left;font-size:11px;font-weight:800;transition:.15s
}
.status-option:hover{border-color:#7fb0ee}
.status-option.on[data-status="completed"]{color:var(--completed);border-color:var(--completed);background:var(--completed-bg)}
.status-option.on[data-status="perfect"]{color:var(--perfect);border-color:var(--perfect);background:var(--perfect-bg);box-shadow:inset 0 0 0 1px rgba(22,119,255,.08)}
.status-option.on[data-status="finish"]{color:var(--finish);border-color:var(--finish);background:var(--finish-bg)}
.status-option.on[data-status="preorder"]{color:var(--preorder);border-color:var(--preorder);background:var(--preorder-bg)}
.detail-info{font-size:10px;color:var(--muted);margin-top:6px}
.modal-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:21px}
.foot-right{display:flex;gap:8px}
.link-btn{text-decoration:none}
.danger{color:#e55a6e}
.toast{
  position:fixed;right:20px;bottom:20px;padding:10px 13px;border-radius:11px;
  background:var(--panel-solid);border:1px solid var(--line-strong);box-shadow:var(--shadow);
  font-size:11px;opacity:0;transform:translateY(6px);pointer-events:none;transition:.18s;z-index:80
}
.toast.show{opacity:1;transform:none}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:45px}
@media(max-width:920px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
@media(max-width:650px){
  .shell{padding:15px 12px 45px}
  .topbar{align-items:flex-start;flex-direction:column}
  .top-actions{width:100%}.top-actions .btn{flex:1}
  .hero{padding:16px}.hero-top{align-items:flex-start}
  .hero h1{font-size:22px}.stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card-body{padding:10px}
  .game-title{font-size:12.5px;min-height:46px}
  .status{font-size:7.5px;padding:5px 6px}
  .status-options{grid-template-columns:1fr}
}
@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style>
</head>

      <div class="foot-right">
        <a class="btn link-btn" id="steamLink" target="_blank" rel="noopener">Steam</a>
        <button class="btn primary" id="saveDetailBtn">Zapisz</button>
      </div>
    </div>
  </section>
</div>

<div class="modal-backdrop" id="addBackdrop">
  <section class="modal">
    <div class="modal-head">
      <div><div class="eyebrow">Nowa pozycja</div><h2>Dodaj grę</h2></div>
      <button class="close" data-close="addBackdrop">✕</button>
    </div>
    <div class="field"><label>Tytuł</label><input id="addTitle" type="text" autocomplete="off"></div>
    <div class="field"><label>Data premiery (opcjonalnie)</label><input id="addDate" type="date"></div>

    <div class="modal-foot"><span></span><button class="btn primary" id="confirmAddBtn">Dodaj</button></div>
  </section>
</div>

<div class="toast" id="toast">Zapisano</div>

function isFutureRelease(dateStr){
  if(!dateStr)return false;
  const d=new Date(dateStr+"T00:00:00");
  const n=new Date();
  const today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return d>today;
}

function normalizeGames(arr){
  return (Array.isArray(arr)?arr:[]).map(g=>{
    const fixed=GAME_META[g.id]||{};
    const old=g.statuses||{};
    const releaseDate=g.releaseDate||fixed.releaseDate||"";

    let selected=null;
    if(isFutureRelease(releaseDate)) selected="preorder";
    else if(old.perfect) selected="perfect";
    else if(old.finish) selected="finish";
    else if(old.completed) selected="completed";

    return {
      ...g,
      releaseDate,
      steamAppId:g.steamAppId||fixed.steamAppId||null,
      statuses:{
        completed:selected==="completed",
        perfect:selected==="perfect",
        finish:selected==="finish",
        preorder:selected==="preorder"
      }
    };
  });
}

function cloneInitial(){return normalizeGames(JSON.parse(JSON.stringify(INITIAL_GAMES)))}
function loadGames(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    return raw?normalizeGames(JSON.parse(raw)):cloneInitial();
  }catch(e){return cloneInitial()}
}

let games=loadGames();
let currentId=null;

function syncAutomaticPreorder(g){
  if(!g)return;
  if(isFutureRelease(g.releaseDate)){
    Object.keys(g.statuses).forEach(k=>g.statuses[k]=false);
    g.statuses.preorder=true;
  }else if(g.statuses.preorder){
    g.statuses.preorder=false;
  }
}

function save(show=true){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(games));
  if(show) toast("Zapisano");
}
function toast(text){
  const e=document.getElementById("toast");
  e.textContent=text;e.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>e.classList.remove("show"),1100);
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
}
function sortedGames(){
  return [...games].sort((a,b)=>a.title.localeCompare(b.title,"pl",{numeric:true,sensitivity:"base"}));
}
function formatDate(s){
  if(!s)return "";
  const d=new Date(s+"T00:00:00");
  return d.toLocaleDateString("pl-PL",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function daysUntil(s){
  if(!s)return null;
  const d=new Date(s+"T00:00:00");
  const n=new Date();
  const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.ceil((d-t)/86400000);
}
function countdownText(g){
  if(!g.releaseDate||!g.statuses.preorder)return "";
  const d=daysUntil(g.releaseDate);
  if(d>1)return `premiera za ${d} dni`;
  if(d===1)return "premiera jutro";
  if(d===0)return "premiera dzisiaj";
  return "";
}
function selectedStatus(g){
  return Object.keys(STATUS).find(k=>g.statuses[k])||"";
}
function statusBadge(key){
  if(!key)return "";
  const s=STATUS[key];
  return `<span class="status ${s.cls}">${key==="perfect"?`<img class="badge100" src="${PERFECT_BADGE_URL}" alt="">`:""}${esc(s.label)}</span>`;
}

function renderStats(){
  const defs=[
    ["completed","Ukończone"],
    ["perfect","100%"],
    ["finish","Do skończenia"],
    ["preorder","Preorder"]
  ];
  document.getElementById("stats").innerHTML=defs.map(([k,l])=>`
    <div class="stat"><div class="stat-n">${games.filter(g=>g.statuses[k]).length}</div><div class="stat-l">${l}</div></div>
  `).join("");
}
function renderLibrary(){
  const root=document.getElementById("library");
  const list=sortedGames();
  if(!list.length){root.innerHTML='<div class="empty">Lista jest pusta.</div>';return}
  root.innerHTML=list.map(g=>{
    const key=selectedStatus(g);
    const cd=countdownText(g);
    return `
      <article class="card" data-open="${esc(g.id)}" data-status="${key}">
        <div class="card-body">
          <div class="game-title">${esc(g.title)}</div>
          <div class="meta">
            <span>${formatDate(g.releaseDate)}</span>
            ${cd?`<span>·</span><span class="countdown">${esc(cd)}</span>`:""}
          </div>
          <div class="status-wrap">${statusBadge(key)}</div>
        </div>
      </article>`;
  }).join("");
}
function render(){
  document.getElementById("totalCount").textContent=games.length;
  renderStats();
  renderLibrary();
}

function renderDetailStatuses(g){
  document.getElementById("detailStatuses").innerHTML=Object.entries(STATUS).map(([k,v])=>`
    <button class="status-option ${g.statuses[k]?"on":""}" data-detail-toggle="${k}" data-status="${k}">
      ${k==="perfect"?`<img class="badge100" src="${PERFECT_BADGE_URL}" alt=""> `:""}${esc(v.label)}
    </button>
  `).join("");
}
function updateDetailCountdown(){
  const date=document.getElementById("detailDate").value;
  const out=document.getElementById("detailCountdown");
  if(!date){out.textContent="";return}
  const d=daysUntil(date);
  if(d>1)out.textContent=`Premiera za ${d} dni.`;
  else if(d===1)out.textContent="Premiera jutro.";
  else if(d===0)out.textContent="Premiera dzisiaj.";
  else out.textContent="Gra jest już po premierze.";
}
function openDetail(id){
  currentId=id;
  const g=games.find(x=>x.id===id);
  if(!g)return;
  syncAutomaticPreorder(g);
  document.getElementById("detailHeading").textContent=g.title;
  document.getElementById("detailTitle").value=g.title;
  document.getElementById("detailDate").value=g.releaseDate||"";
  renderDetailStatuses(g);
  updateDetailCountdown();
  const link=document.getElementById("steamLink");
  if(g.steamAppId){
    link.style.display="inline-flex";
    link.href=`https://store.steampowered.com/app/${g.steamAppId}/`;
  }else{
    link.style.display="none";
  }
  document.getElementById("detailBackdrop").classList.add("open");
}

document.addEventListener("click",e=>{
  const t=e.target;
  const card=t.closest?.("[data-open]");
  if(card){openDetail(card.dataset.open);return}

  if(t.dataset.detailToggle){
    const g=games.find(x=>x.id===currentId);
    if(!g)return;
    const key=t.dataset.detailToggle;
    const currentDate=document.getElementById("detailDate").value;

    if(isFutureRelease(currentDate) && key!=="preorder"){
      toast("Gra przed premierą — status Preorder jest ustawiany automatycznie");
      Object.keys(g.statuses).forEach(k=>g.statuses[k]=false);
      g.statuses.preorder=true;
      renderDetailStatuses(g);
      return;
    }

    const wasActive=!!g.statuses[key];
    Object.keys(g.statuses).forEach(k=>g.statuses[k]=false);
    if(!wasActive)g.statuses[key]=true;
    renderDetailStatuses(g);
    return;
  }

  if(t.dataset.close){
    document.getElementById(t.dataset.close).classList.remove("open");
    return;
  }
  if(t.classList.contains("modal-backdrop"))t.classList.remove("open");
});

document.getElementById("detailDate").addEventListener("input",()=>{
  updateDetailCountdown();
  const g=games.find(x=>x.id===currentId);
  if(!g)return;
  g.releaseDate=document.getElementById("detailDate").value;
  syncAutomaticPreorder(g);
  renderDetailStatuses(g);
});

document.getElementById("saveDetailBtn").addEventListener("click",()=>{
  const g=games.find(x=>x.id===currentId);
  if(!g)return;
  const title=document.getElementById("detailTitle").value.trim();
  if(!title)return toast("Tytuł nie może być pusty");
  g.title=title;
  g.releaseDate=document.getElementById("detailDate").value;
  syncAutomaticPreorder(g);
  save(false);
  document.getElementById("detailBackdrop").classList.remove("open");
  render();
  toast("Zmiany zapisane");
});

document.getElementById("deleteBtn").addEventListener("click",()=>{
  const g=games.find(x=>x.id===currentId);
  if(!g)return;
  if(confirm(`Usunąć „${g.title}” z listy?`)){
    games=games.filter(x=>x.id!==currentId);
    save(false);
    document.getElementById("detailBackdrop").classList.remove("open");
    render();
    toast("Gra usunięta");
  }
});

document.getElementById("addBtn").addEventListener("click",()=>{
  document.getElementById("addTitle").value="";
  document.getElementById("addDate").value="";
  document.getElementById("addAppId").value="";
  document.getElementById("addBackdrop").classList.add("open");
  setTimeout(()=>document.getElementById("addTitle").focus(),60);
});

document.getElementById("confirmAddBtn").addEventListener("click",()=>{
  const title=document.getElementById("addTitle").value.trim();
  if(!title)return toast("Wpisz tytuł gry");
  const app=document.getElementById("addAppId").value.trim();
  const releaseDate=document.getElementById("addDate").value;
  const newGame={
    id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    title,
    releaseDate,
    steamAppId:app?Number(app):null,
    statuses:{completed:false,perfect:false,finish:false,preorder:false}
  };
  syncAutomaticPreorder(newGame);
  games.push(newGame);
  save(false);
  document.getElementById("addBackdrop").classList.remove("open");
  render();
  toast("Gra dodana");
});


function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  localStorage.setItem(THEME_KEY,theme);
  const dark=theme==="dark";
  document.getElementById("themeIcon").textContent=dark?"☀":"☾";
  document.getElementById("themeLabel").textContent=dark?"Tryb jasny":"Tryb ciemny";
}
document.getElementById("themeBtn").addEventListener("click",()=>{
  applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
});
applyTheme(localStorage.getItem(THEME_KEY)||"light");

document.addEventListener("keydown",e=>{
  if(e.key==="Escape")document.querySelectorAll(".modal-backdrop.open").forEach(x=>x.classList.remove("open"));
  if(e.key==="Enter"&&document.getElementById("addBackdrop").classList.contains("open")){
    document.getElementById("confirmAddBtn").click();
  }
});

function applyProfile(data){
  if(!data)return;
  if(data.name)document.getElementById("profileName").textContent=data.name;
  if(data.avatar){
    const img=document.getElementById("profileAvatar");
    const fb=document.getElementById("avatarFallback");
    img.onload=()=>{img.style.display="block";fb.style.display="none"};
    img.src=data.avatar;
  }
}
async function loadProfile(){
  try{
    const cached=JSON.parse(localStorage.getItem(PROFILE_CACHE_KEY)||"null");
    if(cached)applyProfile(cached);
  }catch(e){}
  const xml=STEAM_PROFILE_URL+"?xml=1";
  const proxy="https://api.allorigins.win/raw?url="+encodeURIComponent(xml);
  try{
    const r=await fetch(proxy,{cache:"no-store"});
    if(!r.ok)throw 0;
    const doc=new DOMParser().parseFromString(await r.text(),"text/xml");
    const val=q=>doc.querySelector(q)?.textContent.trim()||"";
    const data={name:val("steamID")||"shinhati",avatar:val("avatarFull")||val("avatarMedium")||""};
    applyProfile(data);
    localStorage.setItem(PROFILE_CACHE_KEY,JSON.stringify(data));
  }catch(e){}
}

render();
loadProfile();
</script>
</body>
</html>
