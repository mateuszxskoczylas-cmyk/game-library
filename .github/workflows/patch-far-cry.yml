name: Patch Far Cry entry

on:
  push:
    paths:
      - '.github/workflows/patch-far-cry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Far Cry 3 with Far Cry 5
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"id":"g46","title":"Far Cry 3","releaseDate":"2012-11-29","statuses":{"completed":true,"perfect":false,"finish":false,"preorder":false},"steamAppId":220240', '"id":"g46","title":"Far Cry 5","releaseDate":"2018-03-26","statuses":{"completed":true,"perfect":false,"finish":false,"preorder":false},"steamAppId":552520')
          s = s.replace('"g46":{"releaseDate":"2012-11-29","steamAppId":220240}', '"g46":{"releaseDate":"2018-03-26","steamAppId":552520}')
          old = '    const releaseDate=g.releaseDate||fixed.releaseDate||"";'
          new = '    const releaseDate=g.id==="g46" ? "2018-03-26" : (g.releaseDate||fixed.releaseDate||"");\n    const title=g.id==="g46" ? "Far Cry 5" : g.title;\n    const steamAppId=g.id==="g46" ? 552520 : (g.steamAppId||fixed.steamAppId||null);'
          if old in s:
              s = s.replace(old, new, 1)
              s = s.replace('      ...g,\n      releaseDate,\n      steamAppId:g.steamAppId||fixed.steamAppId||null,', '      ...g,\n      title,\n      releaseDate,\n      steamAppId,', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "chatgpt-game-library"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Replace Far Cry 3 with Far Cry 5"
          git push
