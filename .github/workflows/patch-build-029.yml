name: Apply BUILD 029
on:
  push:
    paths:
      - 'scripts/patch_build_029.py'
      - '.github/workflows/patch-build-029.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_build_029.py
      - name: Commit BUILD 029
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Move released games to end of yearly rows"
          git push
