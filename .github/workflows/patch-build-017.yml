name: Apply BUILD 017

on:
  push:
    paths:
      - "scripts/patch_build_017.py"
      - ".github/workflows/patch-build-017.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python scripts/patch_build_017.py

      - name: Commit BUILD 017
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add retro Game Awards info window"
          git push
