name: Apply BUILD 020

on:
  push:
    paths:
      - 'scripts/patch_build_020.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_build_020.py
      - name: Commit BUILD 020
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Restore Assassin covers and add retro desktop icons"
          git push
