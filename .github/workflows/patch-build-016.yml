name: Apply BUILD 016

on:
  push:
    paths:
      - "scripts/patch_build_016.py"
      - ".github/workflows/patch-build-016.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python scripts/patch_build_016.py

      - name: Commit BUILD 016
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Link game cards to Steam and PlayStation stores"
          git push
