name: Apply BUILD 019

on:
  push:
    paths:
      - "scripts/patch_build_019.py"
      - ".github/workflows/patch-build-019.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_build_019.py
      - name: Commit BUILD 019
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add artwork, next-release panel and source badges"
          git push
