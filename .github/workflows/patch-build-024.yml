name: Apply BUILD 024
on:
  push:
    paths:
      - '.github/workflows/patch-build-024.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_build_024.py
      - name: Commit BUILD 024
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix desktop icon interaction" || exit 0
          git push
# retry desktop icon interaction
