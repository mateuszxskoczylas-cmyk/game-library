name: Apply BUILD 027
on:
  push:
    paths:
      - 'scripts/patch_build_027.py'
      - '.github/workflows/patch-build-027.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_build_027.py
      - name: Commit BUILD 027
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add draggable desktop windows and light-mode sun"
          git push