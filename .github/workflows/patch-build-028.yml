name: Apply BUILD 028
on:
  push:
    paths:
      - 'scripts/patch_build_028.py'
      - '.github/workflows/patch-build-028.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_build_028.py
      - name: Commit BUILD 028
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix night contrast and add light-mode sun"
          git push