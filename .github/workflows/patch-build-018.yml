name: Apply BUILD 018

on:
  push:
    paths:
      - "scripts/patch_build_018.py"
      - ".github/workflows/patch-build-018.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python scripts/patch_build_018.py

      - name: Commit BUILD 018
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add Lollipop Chainsaw project and simplify TGA panel"
          git push
