name: Apply BUILD 021

on:
  push:
    paths:
      - '.github/workflows/patch-build-021.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_build_021.py
      - name: Commit BUILD 021
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refine Y2K UI and desktop mode" || exit 0
          git push
