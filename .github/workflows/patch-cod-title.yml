name: Patch COD title

on:
  push:
    paths:
      - '.github/workflows/patch-cod-title.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Call of Duty entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"id":"g15","title":"Call of Duty®"', '"id":"g15","title":"Call of Duty®: Modern Warfare® 4"', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "chatgpt-game-library"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Rename Call of Duty to Modern Warfare 4"
          git push
