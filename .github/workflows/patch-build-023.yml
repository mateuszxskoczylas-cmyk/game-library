name: Apply BUILD 023
on:
  push:
    paths:
      - scripts/patch_build_023.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_build_023.py
      - name: Commit BUILD 023
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refine view menu, help and night mode"
          git push
