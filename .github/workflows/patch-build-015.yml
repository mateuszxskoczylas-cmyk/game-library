name: Apply BUILD 015

on:
  push:
    paths:
      - "scripts/patch_build_015.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python scripts/patch_build_015.py

      - name: Commit BUILD 015
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add released-game state and restore Easter eggs"
          git push
