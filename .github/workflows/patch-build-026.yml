name: Apply BUILD 026
on:
  push:
    paths:
      - 'scripts/patch_build_026.py'
      - '.github/workflows/patch-build-026.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_build_026.py
      - name: Commit BUILD 026
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Integrate desktop shell with main page"
          git push
