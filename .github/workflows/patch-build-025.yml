name: Apply BUILD 025
on:
  push:
    paths:
      - 'scripts/patch_build_025.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_build_025.py
      - name: Commit BUILD 025
        run: |
          git config user.name "game-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Reset easter eggs and refine desktop interactions"
          git push
